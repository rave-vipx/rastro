[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "rastro-engine"
version = "0.1.0.dev0"
description = "Schema-first web data extraction with explicit outcomes and field-level provenance."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Rastro contributors"}]
keywords = ["web-data", "extraction", "pydantic", "provenance", "scrapling"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.14.1,<3",
  "scrapling>=0.5,<0.6",
  "structlog>=26.1.0,<27",
]

[project.optional-dependencies]
http = ["curl-cffi>=0.16.1,<0.17", "protego>=0.6.2,<0.7"]

[project.urls]
Homepage = "https://github.com/rave-vipx/rastro"
Documentation = "https://rave-vipx.github.io/rastro/"
Repository = "https://github.com/rave-vipx/rastro"
Issues = "https://github.com/rave-vipx/rastro/issues"
Changelog = "https://github.com/rave-vipx/rastro/blob/main/CHANGELOG.md"

[project.scripts]
rastro = "rastro.cli:main"

[dependency-groups]
dev = [
  "curl-cffi>=0.16.1,<0.17",
  "protego>=0.6.2,<0.7",
  "hypothesis>=6,<7",
  "mypy>=1.19,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7,<8",
  "pytest-socket>=0.7,<1",
  "ruff>=0.14,<1",
  "twine>=7,<8",
]
docs = ["mkdocs-material>=9.7,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/rastro"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml", "/uv.lock", "/mkdocs.yml", "/CONTRIBUTING.md", "/SECURITY.md", "/RASTRO_MASTER_SPEC.md"]

[tool.uv]
required-version = ">=0.13.1,<0.14"

[tool.ruff]
extend-exclude = ["RASTRO_MASTER_SPEC.md"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "examples"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --disable-socket --cov=rastro --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["rastro"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "^\\s*\\.\\.\\.$"]
