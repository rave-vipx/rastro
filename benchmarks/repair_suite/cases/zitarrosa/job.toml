format_version = 1
recipe_memory = "recipes.sqlite"

[region]
locale = "es-UY"
languages = ["es-UY", "es"]
timezone = "America/Montevideo"
currency = "UYU"

[repair]
auto_promote = true
min_records = 5

[dataset]
name = "zitarrosa_suite"
path = "data.sqlite"
identity = ["performance_id"]
match_fields = ["title", "starts_at", "ticket_url"]
match_tolerance_minutes = 90

[[sources]]
kind = "file"
path = "page.html"
url = "https://zitarrosa.example/agenda/"

[sources.recipe]
version = 1
strategy = "css"
record_selector = "main > ul > li.evento"
require_evidence = true

[sources.recipe.fields]
performance_id = "::attr(data-id)"
title = "h3::text"
starts_at = "span.fecha::text"
ticket_url = "a::attr(href)"

[[fields]]
name = "title"
type = "string"
min_length = 1
[[fields]]
name = "starts_at"
type = "datetime"

[[fields]]
name = "ticket_url"
type = "url"

[[fields]]
name = "performance_id"
type = "string"
min_length = 1
[[consistency]]
kind = "after_observation"
field = "starts_at"
tolerance_minutes = 60

[[consistency]]
kind = "distinct_ratio"
field = "starts_at"
min_ratio = 0.5
min_records = 3

[[consistency]]
kind = "historical_shift"
field = "starts_at"
max_shift = 45
unit = "days"
min_history = 3

# User-declared rule: this agenda expects varied event titles.
[[consistency]]
kind = "distinct_ratio"
field = "title"
min_ratio = 0.5
min_records = 3
