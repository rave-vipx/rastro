# Offline events job: three invented venue listing pages read from local files into one dataset. Used by tests and as a
# multi-source example; no network.
format_version = 1

[region]
locale = "es-UY"
languages = ["es-UY", "es"]
timezone = "Etc/GMT+3"
currency = "UYU"

[acquisition]
allowed_hosts = [
  "agenda.example",
  "tickets.example",
  "salanorte.example",
  "clubfaro.example",
]
max_concurrency = 1
min_interval_seconds = 2.0
request_timeout_seconds = 15.0
operation_timeout_seconds = 45.0
max_redirects = 3

[dataset]
name = "event_agenda"
path = "agenda.sqlite"
identity = ["title", "venue", "starts_on"]
match_tolerance_minutes = 90
match_fields = ["title", "venue", "starts_at"]

[[sources]]
kind = "file"
path = "teatro-central-espectaculos.html"
url = "https://agenda.example/espectaculos/"

[sources.recipe]
version = 1
strategy = "css"
record_selector = ".item .cyg--info.espectaculo"
require_evidence = true

# A card can list several dates in sibling <time> nodes; the first one identifies it.
[sources.recipe.fields]
title = "h2.cyg--display-3::text"
performers = "p::text"
category = "span.cyg--etiqueta:last-of-type::text"
venue = "address img::attr(alt)"
starts_on = "time.cyg--dia:first-of-type::text"
starts_at = "time.cyg--dia:first-of-type::text"
ticket_url = "a.cyg--btn::attr(href)"

[[sources]]
kind = "file"
path = "sala-norte-programacion.html"
url = "https://salanorte.example/programacion"

[sources.recipe]
version = 1
strategy = "css"
record_selector = "a.card"
require_evidence = true

# The cards state a day and month but no time; the venue is printed once in the footer.
[sources.recipe.fields]
title = "h4.card-title::text"
category = ".eventCard_tags span::text"
venue = "document:footer#mainFooter strong.mt-4::text"
starts_on = ".eventCard_date span::text"
ticket_url = "::attr(href)"

[[sources]]
kind = "file"
path = "club-faro-cartelera.html"
url = "https://clubfaro.example/"

[sources.recipe]
version = 1
strategy = "css"
record_selector = "div.evento"
require_evidence = true

# The venue is the desktop header's site name. The date (weekday, day, month) and the hour sit in different nodes: only the date is read.
# An event on several days has one h6 per day; the first identifies it.
[sources.recipe.fields]
title = "h4.evento--titulo::text"
performers = "h5.evento--subtitulo::text"
venue = "document:div.page--header-desk h1 span::text"
starts_on = "h6.evento--fecha:first-of-type::text"
ticket_url = "a.evento--a::attr(href)"

[[fields]]
name = "title"
type = "string"
min_length = 1

[[fields]]
name = "performers"
type = "string"
required = false
min_length = 1

[[fields]]
name = "category"
type = "string"
required = false
min_length = 1

[[fields]]
name = "venue"
type = "string"
min_length = 1

[[fields]]
name = "city"
type = "string"
required = false
min_length = 1

[[fields]]
name = "starts_on"
type = "date"
localized = true

[[fields]]
name = "starts_at"
type = "datetime"
required = false
localized = true

[[fields]]
name = "ticket_url"
type = "url"

[[fields]]
name = "price"
type = "decimal"
required = false
ge = 0

[[fields]]
name = "currency"
type = "string"
required = false
min_length = 3
max_length = 3

# Event datetimes must not be before the observation time (one hour of slack). Listings keep
# a show that already started for a while (Teatro Central, 2026-11-11: 1 of 16), so a quarter may lie
# in the past; sale dates read as event dates put almost all of them there. A source with
# fewer than 4 rows (Tickets) still holds when one of its shows has started.
[[consistency]]
kind = "after_observation"
field = "starts_at"
tolerance_minutes = 60
max_violation_ratio = 0.25

# Many performances must not collapse onto a single date (a sale date repeats per event).
[[consistency]]
kind = "distinct_ratio"
field = "starts_at"
min_ratio = 0.5
min_records = 3

# The median start must stay near the dataset history (an agenda rolls forward slowly).
[[consistency]]
kind = "historical_shift"
field = "starts_at"
max_shift = 45
unit = "days"
min_history = 3
