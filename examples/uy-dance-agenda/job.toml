# Public dance events in Uruguay from venue listing pages (SODRE, Sala Zitarrosa,
# Magnolio Sala) and a ticket seller event page (Tickantel), loaded into one dataset.
# Venue pages without a time give `starts_on`; `starts_at` is filled only when the
# page states a time. Rejected by robots on 2026-11-08, so not listed: Passline, Entraste.
format_version = 1

[region]
locale = "es-UY"
languages = ["es-UY", "es"]
timezone = "America/Montevideo"
currency = "UYU"

[acquisition]
allowed_hosts = [
  "sodre.gub.uy",
  "tickantel.com.uy",
  "salazitarrosa.montevideo.gub.uy",
  "magnoliosala.uy",
]
max_concurrency = 1
min_interval_seconds = 2.0
request_timeout_seconds = 15.0
operation_timeout_seconds = 45.0
max_redirects = 3

[dataset]
name = "uy_dance_agenda"
path = "agenda.sqlite"
identity = ["title", "venue", "starts_on"]
match_tolerance_minutes = 90
match_fields = ["title", "venue", "starts_at"]

[[sources]]
url = "https://sodre.gub.uy/espectaculos/"

[sources.recipe]
version = 1
strategy = "css"
record_selector = ".item .cyg--info.espectaculo"
require_evidence = true

# A card can list several dates in sibling <time> nodes; the first one identifies it.
[sources.recipe.fields]
title = "h2.cyg--display-3::text"
performers = "p::text"
category = "span.cyg--etiqueta:last-of-type::text"
venue = "address img::attr(alt)"
starts_on = "time.cyg--dia:first-of-type::text"
starts_at = "time.cyg--dia:first-of-type::text"
ticket_url = "a.cyg--btn::attr(href)"

[[sources]]
url = "https://salazitarrosa.montevideo.gub.uy/programacion"

[sources.recipe]
version = 1
strategy = "css"
record_selector = "a.card"
require_evidence = true

# The cards state a day and month but no time; the venue is printed once in the footer.
[sources.recipe.fields]
title = "h4.card-title::text"
category = ".eventCard_tags span::text"
venue = "document:footer#mainFooter strong.mt-4::text"
starts_on = ".eventCard_date span::text"
ticket_url = "::attr(href)"

[[sources]]
url = "https://magnoliosala.uy/"

[sources.recipe]
version = 1
strategy = "css"
record_selector = "div.evento"
require_evidence = true

# The venue is the desktop header's site name. The date (weekday, day, month) and the hour sit in different nodes: only the date is read.
# An event on several days has one h6 per day; the first identifies it.
[sources.recipe.fields]
title = "h4.evento--titulo::text"
performers = "h5.evento--subtitulo::text"
venue = "document:div.page--header-desk h1 span::text"
starts_on = "h6.evento--fecha:first-of-type::text"
ticket_url = "a.evento--a::attr(href)"

[[sources]]
url = "https://tickantel.com.uy/ng/espectaculo/40021938/muestra-final-2026-area-tango-y-area-candombe"

[sources.recipe]
version = 1
strategy = "jsonld"
item_type = "Event"
require_evidence = true

[sources.recipe.fields]
title = "/name"
performers = "/performer/name"
venue = "/location/name"
city = "/location/address/addressLocality"
starts_on = "/startDate"
starts_at = "/startDate"
ticket_url = "/offers/url"
price = "/offers/price"
currency = "/offers/priceCurrency"

[[fields]]
name = "title"
type = "string"
min_length = 1

[[fields]]
name = "performers"
type = "string"
required = false
min_length = 1

[[fields]]
name = "category"
type = "string"
required = false
min_length = 1

[[fields]]
name = "venue"
type = "string"
min_length = 1

[[fields]]
name = "city"
type = "string"
required = false
min_length = 1

[[fields]]
name = "starts_on"
type = "date"
localized = true

[[fields]]
name = "starts_at"
type = "datetime"
required = false
localized = true

[[fields]]
name = "ticket_url"
type = "url"

[[fields]]
name = "price"
type = "decimal"
required = false
ge = 0

[[fields]]
name = "currency"
type = "string"
required = false
min_length = 3
max_length = 3

# Event datetimes must not be before the observation time (one hour of slack). Listings keep
# a show that already started for a while (SODRE, 2026-11-11: 1 of 16), so a quarter may lie
# in the past; sale dates read as event dates put almost all of them there.
[[consistency]]
kind = "after_observation"
field = "starts_at"
tolerance_minutes = 60
max_violation_ratio = 0.25

# Many performances must not collapse onto a single date (a sale date repeats per event).
[[consistency]]
kind = "distinct_ratio"
field = "starts_at"
min_ratio = 0.5
min_records = 3

# The median start must stay near the dataset history (an agenda rolls forward slowly).
[[consistency]]
kind = "historical_shift"
field = "starts_at"
max_shift = 45
unit = "days"
min_history = 3
