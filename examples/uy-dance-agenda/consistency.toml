# Semantic consistency rules for the dance agenda (QUAL-005/006). Generic rule kinds; only
# the field name and thresholds are specific to this job. They catch a recipe that reads a
# ticket sale date where the event date belongs: both are valid datetimes.
# Once the job schema accepts a `consistency` block, copy these entries into job.toml.

# Event datetimes must not be before the observation time (one hour of slack).
[[consistency]]
kind = "after_observation"
field = "starts_at"
tolerance_minutes = 60

# Many performances must not collapse onto a single date (a sale date repeats per event).
[[consistency]]
kind = "distinct_ratio"
field = "starts_at"
min_ratio = 0.5
min_records = 3

# The median start must stay near the dataset history (an agenda rolls forward slowly).
[[consistency]]
kind = "historical_shift"
field = "starts_at"
max_shift = 45
unit = "days"
min_history = 3
