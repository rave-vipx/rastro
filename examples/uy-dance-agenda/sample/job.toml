# Reproducible offline sample of the Uruguay dance agenda pilot job.
# Uses synthetic HTML pages mimicking SODRE and Tickantel structures.
format_version = 1

[region]
locale = "es-UY"
languages = ["es-UY", "es"]
timezone = "America/Montevideo"
currency = "UYU"

[dataset]
name = "uy_dance_agenda"
path = "agenda.sqlite"
identity = ["performance_id"]
match_fields = ["title", "venue", "starts_at"]
match_tolerance_minutes = 90

[[sources]]
kind = "file"
path = "sodre-cartelera.html"
url = "https://sodre.gub.uy/espectaculos/"

[sources.recipe]
version = 1
strategy = "css"
record_selector = ".item .cyg--info.espectaculo"
require_evidence = true

[sources.recipe.fields]
performance_id = "::attr(data-performance-id)"
title = "h2.cyg--display-3::text"
performers = "p::text"
venue = "address img::attr(alt)"
city = "address span.cyg--ciudad::text"
starts_at = "time.cyg--dia::text"
ticket_url = "a.cyg--btn::attr(href)"
price = "span.cyg--precio::text"
currency = "span.cyg--moneda::text"

[[sources.recipe.fallbacks]]
strategy = "css"
record_selector = ".item .cyg--info.espectaculo"
require_evidence = true

[sources.recipe.fallbacks.fields]
performance_id = "::attr(data-performance-id)"
title = "h2.cyg--display-3::text"
performers = "p::text"
venue = "address img::attr(alt)"
city = "address img::attr(alt)"
starts_at = "time.cyg--dia::text"
ticket_url = "a.cyg--btn::attr(href)"

[[sources]]
kind = "file"
path = "tickantel-evento.html"
url = "https://tickantel.com.uy/ng/espectaculo/9900102/gala-anual-2026-area-tango-y-milonga"

[sources.recipe]
version = 1
strategy = "jsonld"
item_type = "Event"
require_evidence = true

[sources.recipe.fields]
performance_id = "/identifier"
title = "/name"
performers = "/performer/name"
venue = "/location/name"
city = "/location/address/addressLocality"
starts_at = "/startDate"
ticket_url = "/offers/url"
price = "/offers/price"
currency = "/offers/priceCurrency"

[[sources.recipe.fallbacks]]
strategy = "jsonld"
item_type = "Event"
require_evidence = true

[sources.recipe.fallbacks.fields]
performance_id = "/identifier"
title = "/name"
performers = "/description"
venue = "/location/name"
city = "/location/address/addressCountry"
starts_at = "/startDate"
ticket_url = "/offers/url"
price = "/offers/price"
currency = "/offers/priceCurrency"

[[fields]]
name = "title"
type = "string"
min_length = 1

[[fields]]
name = "performers"
type = "string"
min_length = 1

[[fields]]
name = "venue"
type = "string"
min_length = 1

[[fields]]
name = "city"
type = "string"
min_length = 1

[[fields]]
name = "starts_at"
type = "datetime"
localized = true

[[fields]]
name = "ticket_url"
type = "url"

[[fields]]
name = "price"
type = "decimal"
required = false
ge = 0

[[fields]]
name = "currency"
type = "string"
required = false
min_length = 3
max_length = 3

[[fields]]
name = "performance_id"
type = "string"
min_length = 1

# Event datetimes must not be before the observation time (one hour of slack).
[[consistency]]
kind = "after_observation"
field = "starts_at"
tolerance_minutes = 60

# Many performances must not collapse onto a single date (a sale date repeats per event).
[[consistency]]
kind = "distinct_ratio"
field = "starts_at"
min_ratio = 0.5
min_records = 3

# The median start must stay near the dataset history (an agenda rolls forward slowly).
[[consistency]]
kind = "historical_shift"
field = "starts_at"
max_shift = 45
unit = "days"
min_history = 3
