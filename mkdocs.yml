site_name: Rastro
site_description: Schema-first web data extraction with field-level provenance.
site_url: https://rave-vipx.github.io/rastro/
repo_url: https://github.com/rave-vipx/rastro
repo_name: rave-vipx/rastro
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - HTTP acquisition: acquisition.md
  - Recipe memory: memory.md
  - Optional intelligence: intelligence.md
  - Extraction comparison: comparison.md
  - Recovery benchmark protocol: recovery-benchmark.md
  - Release evidence: release-evidence.md
  - Live Ollama evidence: live-ollama-evidence.md
  - Validation evidence: development/validation-evidence.md
  - API and outcomes: api.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Release checklist: releasing.md
  - Development work log: development/work-log.md
  - Engineering decisions:
      - Recipe model: decisions/0009-recipe-model.md
      - Recovery benchmark protocol: decisions/0011-recovery-benchmark.md
      - Structured JSON responses: decisions/0007-structured-responses.md
      - Explicit proxy egress: decisions/0008-explicit-egress.md
      - Explicit regional context: decisions/0006-explicit-regional-context.md
      - Reproducible evidence: decisions/0005-reproducible-release-evidence.md
      - Bounded recipe learning: decisions/0004-bounded-recipe-learning.md
      - SQLite recipe memory: decisions/0003-sqlite-recipe-memory.md
      - HTTP transport boundary: decisions/0002-policy-aware-acquisition.md
      - Offline first slice: decisions/0001-offline-vertical-slice.md
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
