site_name: Rastro
site_description: Schema-first web data extraction with field-level provenance.
site_url: https://rave-vipx.github.io/rastro/
repo_url: https://github.com/rave-vipx/rastro
repo_name: rave-vipx/rastro
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Getting started: getting-started.md
  - For AI agents: ai-agents.md
  - Stability policy: stability.md
  - Declarative jobs: jobs.md
  - Recipes from examples: suggest.md
  - MCP server: mcp.md
  - Dataset load and export: dataset.md
  - Local Studio: studio.md
  - HTTP acquisition: acquisition.md
  - Recipe memory: memory.md
  - Recipe lifecycle: recipe-lifecycle.md
  - Recipe hub (bundles): hub.md
  - Structural drift: drift.md
  - Semantic consistency: consistency.md
  - Recipe CI and repair: repair.md
  - Instant Mock Lab: mock-lab.md
  - Mock Lab mutations: mock-lab-mutations.md
  - Optional intelligence: intelligence.md
  - Extraction comparison: comparison.md
  - Product-task comparison (v0.2): comparison-v02.md
  - Recovery benchmark protocol: recovery-benchmark.md
  - Release evidence: release-evidence.md
  - Live Ollama evidence: live-ollama-evidence.md
  - Validation evidence: development/validation-evidence.md
  - API and outcomes: api.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Release checklist: releasing.md
  - Clean code and module size: development/clean-code.md
  - Development work log: development/work-log.md
  - Engineering decisions:
      - Bring your own AI: decisions/0022-bring-your-own-ai.md
      - Newer serving recipe wins: decisions/0021-serving-recipe-over-job-file.md
      - Minimal Studio, MCP and Hub: decisions/0020-studio-mcp-hub-minimal.md
      - Last-success repair evidence: decisions/0019-repair-evidence-storage.md
      - Measured drift signals: decisions/0018-drift-signals.md
      - Dataset identity and storage: decisions/0017-dataset-store.md
      - Updatable database outcome: decisions/0016-dataset-outcome.md
      - Recipe lifecycle: decisions/0015-recipe-lifecycle.md
      - Mock Lab fixtures, labels and sanitization: decisions/0014-mock-lab.md
      - Declarative jobs and CLI contracts: decisions/0013-declarative-jobs.md
      - Recovery benchmark protocol: decisions/0011-recovery-benchmark.md
      - Model providers: decisions/0010-model-providers.md
      - Recipe model: decisions/0009-recipe-model.md
      - Structured JSON responses: decisions/0007-structured-responses.md
      - Explicit proxy egress: decisions/0008-explicit-egress.md
      - Product direction after 0.1.0: decisions/0012-product-direction.md
      - Explicit regional context: decisions/0006-explicit-regional-context.md
      - Reproducible evidence: decisions/0005-reproducible-release-evidence.md
      - Bounded recipe learning: decisions/0004-bounded-recipe-learning.md
      - SQLite recipe memory: decisions/0003-sqlite-recipe-memory.md
      - HTTP transport boundary: decisions/0002-policy-aware-acquisition.md
      - Offline first slice: decisions/0001-offline-vertical-slice.md
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
