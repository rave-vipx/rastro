site_name: Rastro
site_description: Schema-first web data extraction with field-level provenance.
site_url: https://rave-vipx.github.io/rastro/
repo_url: https://github.com/rave-vipx/rastro
repo_name: rave-vipx/rastro
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - API and outcomes: api.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Release checklist: releasing.md
  - Engineering decisions:
      - Offline first slice: decisions/0001-offline-vertical-slice.md
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
