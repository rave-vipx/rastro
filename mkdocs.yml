site_name: Rastro
site_description: "Rastro: AI writes the scraper once, recipes keep it running."
site_url: https://rave-vipx.github.io/rastro/
repo_url: https://github.com/rave-vipx/rastro
repo_name: rave-vipx/rastro
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Overview: index.md
  - Guides:
      - Quickstart: quickstart.md
      - Getting started: getting-started.md
      - Local Studio: studio.md
      - Declarative jobs: jobs.md
      - Recipes from examples: suggest.md
      - HTTP acquisition: acquisition.md
      - Proxies and blocked sources: egress.md
      - Browser controls: browser.md
      - Page steps: page-steps.md
      - Network recipes: network-recipes.md
      - Reading results: reading-results.md
      - Dataset load and export: dataset.md
      - Run report: run-report.md
      - Field contracts: fields.md
      - Crawling linked pages: crawling.md
      - Scheduling: scheduling.md
      - Monitoring and alerts: operations.md
      - Structural drift: drift.md
      - Semantic consistency: consistency.md
      - Recipe CI and repair: repair.md
      - Recipe memory: memory.md
      - Recipe lifecycle: recipe-lifecycle.md
      - Recipe hub (bundles): hub.md
      - Bring your own AI: ai.md
      - Optional intelligence: intelligence.md
      - For AI agents: ai-agents.md
      - MCP server: mcp.md
      - Instant Mock Lab: mock-lab.md
      - Mock Lab mutations: mock-lab-mutations.md
