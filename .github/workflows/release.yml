name: Release

# Publishes rastro-engine to PyPI when a maintainer pushes a `v*` tag.
# Trusted Publishing only: no API tokens or repository secrets. See docs/releasing.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --locked
      - name: Require the tag to match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::Tag $TAG does not match package version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Require a changelog section for this version
        run: grep -Eq "^## ${VERSION//./\\.}( |$)" CHANGELOG.md
      - run: uv build
      - run: uv run --no-sync twine check --strict dist/*
      - name: Require exactly one sdist and one wheel of this version
        run: |
          test "$(ls dist | wc -l)" -eq 2
          test -f "dist/rastro_engine-${VERSION}.tar.gz"
          test -f "dist/rastro_engine-${VERSION}-py3-none-any.whl"
      - name: Install the wheel into a clean environment
        run: |
          uv venv "$RUNNER_TEMP/rastro-wheel"
          uv pip install --python "$RUNNER_TEMP/rastro-wheel/bin/python" dist/*.whl
      - name: Smoke-test the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          test "$("$RUNNER_TEMP/rastro-wheel/bin/rastro" --version)" = "rastro ${VERSION}"
          "$RUNNER_TEMP/rastro-wheel/bin/rastro" demo
          "$RUNNER_TEMP/rastro-wheel/bin/python" -c 'import rastro; print(rastro.__version__)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/rastro-engine/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Extract this version's changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: Publish the GitHub release with the distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
