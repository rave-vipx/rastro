name: Scheduled dependency audit
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.1'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/rastro-runtime.txt"
      - run: uv run --no-sync pip-audit --require-hashes -r "$RUNNER_TEMP/rastro-runtime.txt"
