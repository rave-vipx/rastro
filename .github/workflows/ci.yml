name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group docs
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync mkdocs build --strict
      - run: uv build
      - run: uv run --no-sync twine check dist/*
      - name: Install built wheel into a clean environment
        run: |
          uv venv "$RUNNER_TEMP/rastro-wheel"
          uv pip install --python "$RUNNER_TEMP/rastro-wheel/bin/python" dist/*.whl
      - name: Exercise installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/rastro-wheel/bin/rastro" demo
          "$RUNNER_TEMP/rastro-wheel/bin/rastro" doctor

  tests:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python examples/offline.py

  audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/rastro-runtime.txt"
      - run: uv run --no-sync pip-audit --require-hashes -r "$RUNNER_TEMP/rastro-runtime.txt"

  gate:
    name: CI required
    if: always()
    needs: [quality, tests, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every job to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          AUDIT: ${{ needs.audit.result }}
        run: test "$QUALITY" = success && test "$TESTS" = success && test "$AUDIT" = success
