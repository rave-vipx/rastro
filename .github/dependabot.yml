version: 2
updates:
  # Review dependency PRs like any change: read the upstream changelog, run the full checks
  # in CONTRIBUTING.md and merge patch and minor updates that pass; majors are planned work.
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    ignore:
      # Major versions are planned work, not weekly bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Boundary packages (parsing, HTTP, robots, MCP) are excluded so each one
      # gets its own PR and a contract-test review.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns: [scrapling, curl-cffi, protego, mcp]
      development:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: [scrapling, curl-cffi, protego, mcp]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
