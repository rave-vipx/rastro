name: Bug report
description: Report incorrect extraction, unexpected failures, or a reproducible regression.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, use private reporting linked in SECURITY.md. Share only synthetic or explicitly redistributable data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include Python version and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide synthetic HTML, your schema, recipe, and the command or code you ran.
      render: python
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the result status and safe diagnostic codes.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: This report contains no credentials, private page captures, or personal data.
          required: true
